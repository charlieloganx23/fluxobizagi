[build]
  # Define o diretório que contém os arquivos a serem publicados
  publish = "Tentar publicar"
  
  # Não há comando de build necessário pois é um site estático
  command = "echo 'Site estático - sem build necessário'"
  
  # Diretório das Netlify Functions (serverless)
  functions = "netlify/functions"

[functions]
  # Bundler para as funções Node.js
  node_bundler = "esbuild"

# Configurações de headers para melhorar o desempenho
[[headers]]
  for = "/*"
  [headers.values]
    # Cache para arquivos estáticos
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/libs/*"
  [headers.values]
    # Cache mais longo para bibliotecas (1 ano)
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "*.svg"
  [headers.values]
    Content-Type = "image/svg+xml; charset=utf-8"

# Configuração de redirecionamentos (se necessário)
# Redireciona chamadas de API para Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Redireciona /admin para a página de administração
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Fallback desabilitado temporariamente para debug
